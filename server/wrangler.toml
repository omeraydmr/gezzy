name = "traveller-live"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Kayıtlı canlı kartlar (push token → uçuş). Oluştur: npx wrangler kv namespace create ACTIVITIES
[[kv_namespaces]]
binding = "ACTIVITIES"
id = "f882ce8eca3048348496372dfbcd74ed"

# Topluluk öneri havuzu. Oluştur: npx wrangler d1 create traveller-community
# Şema: npx wrangler d1 migrations apply traveller-community --remote
[[d1_databases]]
binding = "DB"
database_name = "traveller-community"
database_id = "e90a5467-10e9-4f58-a14f-8ed63a1ca427"
migrations_dir = "migrations"

# Uçuşlar 5 dakikada bir kontrol edilir.
[triggers]
crons = ["*/5 * * * *"]

[vars]
APNS_BUNDLE_ID = "app.traveller.ios"

# Gizli değerler (npx wrangler secret put <AD>):
#   CLIENT_KEY        uygulamanın X-Traveller-Key başlığı (uygulamadaki LIVE_ACTIVITY_SERVER_KEY ile aynı)
#   CONTRIBUTOR_SALT  katkı veren kimliklerini özetlemek için uzun rastgele değer (değiştirmeyin)
#   RAPIDAPI_KEY      AeroDataBox (RapidAPI) anahtarı
#   APNS_KEY_ID       Apple Developer > Keys'teki APNs anahtarının kimliği
#   APNS_TEAM_ID      Takım kimliği (4BAD86T55H)
#   APNS_PRIVATE_KEY  .p8 dosyasının içeriği (BEGIN/END satırlarıyla)
