name = "traveller-live"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# App Attest challenge'ları (5 dk ömürlü).
[[kv_namespaces]]
binding = "KV"
id = "f882ce8eca3048348496372dfbcd74ed"

# Topluluk öneri havuzu. Oluştur: npx wrangler d1 create traveller-community
# Şema: npx wrangler d1 migrations apply traveller-community --remote
[[d1_databases]]
binding = "DB"
database_name = "traveller-community"
database_id = "e90a5467-10e9-4f58-a14f-8ed63a1ca427"
migrations_dir = "migrations"


[vars]
# App Attest: uygulama kimliği; katkıların imzalı olması zorunlu mu (uygulamanın App Attest'li sürümü yayına çıkınca "true");
# Xcode'dan kurulan geliştirme sürümlerinin attestation'ı kabul edilsin mi.
APP_ID = "4BAD86T55H.com.omeraydemir.stubly"
REQUIRE_APP_ATTEST = "false"
ALLOW_DEV_ATTEST = "true"

# Gizli değerler (npx wrangler secret put <AD>):
#   CLIENT_KEY        uygulamanın X-Stubly-Key başlığı (uygulamadaki STUBLY_SERVER_KEY ile aynı)
#   CONTRIBUTOR_SALT  katkı veren kimliklerini özetlemek için uzun rastgele değer (değiştirmeyin)
